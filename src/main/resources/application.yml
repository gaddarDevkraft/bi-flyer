spring:
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: http://localhost:9090/realms/pm
          jwk-set-uri: http://localhost:9090/realms/pm/protocol/openid-connect/certs

logging:
  level:
    org:
      springframework:
        security: DEBUG

jwt:
  auth:
    converter:
      resource-id: realm-bi-management
      principle-attribute: preferred_username